# Automatische Prüfung bei jedem Push und jeder Pull Request: Typen, Lint und Build.
# Netlify baut die Seite weiterhin selbst; diese Prüfung meldet Fehler früher und kostet nichts (öffentliches Repository).
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # PageProps/LayoutProps erzeugt Next.js selbst; ohne diesen Schritt fehlen sie vor dem Build.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          SITE_URL: https://ohpawstudio.com
